[package]
name = "cc-usage"
version = "0.1.1"
edition = "2021"
description = "A fast, local Claude Code usage and cost tracker — Rust port of ccusage"
license = "MIT"
repository = "https://github.com/jiunjiun/ccu"
homepage = "https://github.com/jiunjiun/ccu"
documentation = "https://github.com/jiunjiun/ccu#readme"
readme = "README.md"
keywords = ["claude", "anthropic", "cli", "usage", "cost"]
categories = ["command-line-utilities"]

[lib]
name = "ccu"
path = "src/lib.rs"

[[bin]]
name = "ccu"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir    = "2"
chrono     = { version = "0.4", features = ["serde", "clock"] }
chrono-tz  = "0.10"
tabled     = "0.20"
anyhow     = "1"
regex      = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = "3"

[profile.release]
lto = "thin"
