[package]
name = "ccu"
version = "0.1.0"
edition = "2021"
description = "Rust CLI that mirrors ccusage against ~/.claude/projects"
license = "MIT"
repository = "https://github.com/jiunjiun/ccu"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ccu"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir    = "2"
chrono     = { version = "0.4", features = ["serde", "clock"] }
chrono-tz  = "0.10"
tabled     = "0.20"
anyhow     = "1"
regex      = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = "3"

[profile.release]
lto = "thin"
